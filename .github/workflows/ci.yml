name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    # Known security advisories in the libraries (Cargo.lock). Exceptions,
    # each with its reason, are in .cargo/audit.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit
      - run: cargo audit

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libtss2-dev libudev-dev libhidapi-dev libdbus-1-dev pkg-config swtpm swtpm-tools dbus libsecret-tools python3-secretstorage gnome-keyring
      - run: cargo fmt --all --check
      - name: Versions agree (Cargo.toml, extension)
        run: contrib/release/version.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: TPM tests against swtpm
        run: |
          mkdir -p /tmp/swtpm
          swtpm socket --tpm2 --server type=tcp,port=2321 --ctrl type=tcp,port=2322 --tpmstate dir=/tmp/swtpm --flags startup-clear --daemon
          TCTI=swtpm:port=2321 cargo test -p vault-hw --lib --locked -- --ignored

  # The cloud sync server (server/sync) in the Workers runtime, locally.
  # `vault cloud setup` uploads server/sync/src/index.js as it is.
  sync-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: server/sync
      - run: npm run check
        working-directory: server/sync
      - run: npm test
        working-directory: server/sync
      - name: Wrangler accepts the Worker (no upload)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
        working-directory: server/sync
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: The Docker server builds, starts and keeps its own certificate
        working-directory: server/sync
        run: |
          docker build -t secret-vault-sync:ci .
          docker run -d --name sync -p 8443:8443 -e SYNC_HOSTS=sync.example.com -v sync-data:/data secret-vault-sync:ci
          for i in $(seq 30); do docker exec sync test -s /data/run/show && break; sleep 1; done
          sleep 2
          docker exec sync show
          docker cp sync:/data/tls/ca.pem "$RUNNER_TEMP/ca.pem"
          curl -fsS --cacert "$RUNNER_TEMP/ca.pem" --resolve sync.example.com:8443:127.0.0.1 https://sync.example.com:8443/ | grep -q secret-vault-sync
          before=$(docker exec sync show | grep fingerprint)
          docker rm -f sync
          docker run -d --name sync -p 8443:8443 -e SYNC_HOSTS=sync.example.com -v sync-data:/data secret-vault-sync:ci
          sleep 5
          test "$(docker exec sync show | grep fingerprint)" = "$before"
          curl -fsS --cacert "$RUNNER_TEMP/ca.pem" --resolve sync.example.com:8443:127.0.0.1 https://sync.example.com:8443/ca.pem | grep -q "BEGIN CERTIFICATE"

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
        working-directory: extension

  # Everything, including the daemon over a named pipe, on Windows.
  # The same tests natively on Windows 11 on Arm too.
  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The installer, Linux packages and extension zip (package.yml), as downloads
  # under each run's Artifacts, versioned X.Y.Z-dev.<commit>.
  packages:
    uses: ./.github/workflows/package.yml
    # The macOS job signs and notarizes when the Apple secrets are set.
    secrets: inherit

  # Everything, including the daemon over a Unix socket, on macOS.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The Secure Enclave helper's slot format, with a software key (runners
      # have no Secure Enclave), and that the real helper builds.
      - name: Secure Enclave helper
        run: |
          contrib/macos/build-se.sh target/se-real
          VAULT_SE_SOFTWARE=1 contrib/macos/build-se.sh target/se-test
          target/se-test/vault-se check
          VAULT_SE_TEST_HELPER=$PWD/target/se-test/vault-se cargo test -p vault-hw --lib --locked enclave -- --nocapture
          # The real one says plainly that there is no enclave here.
          if target/se-real/vault-se check 2> se.err; then echo "runner has a Secure Enclave"; else cat se.err; grep -q "Secure Enclave" se.err; fi
