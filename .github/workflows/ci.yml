name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    # Known security advisories in the libraries (Cargo.lock). Exceptions,
    # each with its reason, are in .cargo/audit.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libtss2-dev libudev-dev libhidapi-dev libdbus-1-dev pkg-config swtpm swtpm-tools dbus libsecret-tools python3-secretstorage gnome-keyring
      - run: cargo fmt --all --check
      - name: Versions agree (Cargo.toml, extension)
        run: contrib/release/version.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: TPM tests against swtpm
        run: |
          mkdir -p /tmp/swtpm
          swtpm socket --tpm2 --server type=tcp,port=2321 --ctrl type=tcp,port=2322 --tpmstate dir=/tmp/swtpm --flags startup-clear --daemon
          TCTI=swtpm:port=2321 cargo test -p vault-hw --lib --locked -- --ignored

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
        working-directory: extension

  # Everything, including the daemon over a named pipe, on Windows.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The installer, Linux packages and extension zip (package.yml), as downloads
  # under each run's Artifacts, versioned X.Y.Z-dev.<commit>.
  packages:
    uses: ./.github/workflows/package.yml
    # The macOS job signs and notarizes when the Apple secrets are set.
    secrets: inherit

  # Everything, including the daemon over a Unix socket, on macOS.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The Secure Enclave helper's slot format, with a software key (runners
      # have no Secure Enclave), and that the real helper builds.
      - name: Secure Enclave helper
        run: |
          contrib/macos/build-se.sh target/se-real
          VAULT_SE_SOFTWARE=1 contrib/macos/build-se.sh target/se-test
          target/se-test/vault-se check
          VAULT_SE_TEST_HELPER=$PWD/target/se-test/vault-se cargo test -p vault-hw --lib --locked enclave -- --nocapture
          # The real one says plainly that there is no enclave here.
          if target/se-real/vault-se check 2> se.err; then echo "runner has a Secure Enclave"; else cat se.err; grep -q "Secure Enclave" se.err; fi
