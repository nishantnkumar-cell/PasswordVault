# Publishes a GitHub Release when a version tag (v0.2.0, ...) is pushed. The
# tag must match the version in Cargo.toml; contrib/release/release.sh makes
# both. A pre-release tag of that version (v0.2.0-beta.1, -alpha.N, -rc.N) is
# published as a public beta: marked pre-release on GitHub, with the
# "## Unreleased" release notes. See docs/user-guide/11-versions-and-upgrades.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/package.yml

  publish:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(contrib/release/version.sh --build)
          if [[ "$version" == *-* ]]; then
            # A beta: the notes so far, under a warning, and marked pre-release.
            section=Unreleased
            title="Secret Vault $version (public beta)"
            prerelease=--prerelease
            {
              echo "> **Public beta.** A preview of $(contrib/release/version.sh) for testing. It has not had a security audit: do not trust it with real secrets yet, and keep a backup of your vault file."
              echo
            } > notes.md
          else
            section=$version
            title="Secret Vault $version"
            prerelease=
            : > notes.md
          fi
          contrib/release/notes.sh "$section" > section.md
          test -s section.md || { echo "no \"## $section\" section in docs/release-notes.md" >&2; exit 1; }
          cat section.md >> notes.md
          # Every download a release promises (docs/user-guide/11-versions-and-upgrades.md).
          for f in "SecretVault-Setup-$version.exe" "secret-vault_${version}_amd64.deb" \
              "secret-vault-$version-linux-x86_64.tar.gz" "SecretVault-$version-macos.pkg" \
              "secret-vault-$version-macos-universal.tar.gz" "secret-vault-extension-$version.zip"; do
            test -f "dist/$f" || { echo "missing dist/$f" >&2; ls -l dist >&2; exit 1; }
          done
          # SHA-256 of every file, so a download can be checked before it is run.
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          ls -l dist && cat dist/SHA256SUMS.txt
          gh release create "v$version" dist/* --title "$title" --notes-file notes.md --verify-tag $prerelease
