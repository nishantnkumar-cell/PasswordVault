[workspace]
resolver = "3"
members = ["crates/vault-cli", "crates/vault-core", "crates/vault-import", "crates/vault-ipc", "crates/vaultd"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

# Argon2id at the format's minimum (64 MiB) is far too slow unoptimized.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
