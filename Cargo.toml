[workspace]
resolver = "3"
members = ["crates/vault-cli", "crates/vault-mobile", "crates/vault-gpg", "crates/vault-gui", "crates/vault-core", "crates/vault-hw", "crates/vault-import", "crates/vault-ipc", "crates/vault-native-host", "crates/vaultd"]
# Patched copies of third-party crates (vendor/README.md). Not workspace members.
exclude = ["vendor"]

[workspace.package]
# The one version for every crate, the extension and the packages. Change it
# with contrib/release.sh, never by hand (docs/user-guide/11-versions-and-upgrades.md).
version = "0.2.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

# Argon2id at the format's minimum (64 MiB) is far too slow unoptimized.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# ml-dsa 0.0.4 (used by pgp 0.21 for post-quantum OpenPGP signatures) with the
# upstream constant-time fix for RUSTSEC-2025-0144 backported. Remove when pgp
# moves to ml-dsa >= 0.1. See vendor/README.md.
[patch.crates-io]
ml-dsa = { path = "vendor/ml-dsa" }
