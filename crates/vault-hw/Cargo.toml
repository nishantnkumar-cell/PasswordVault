[package]
name = "vault-hw"
version = "0.1.0"
description = "Hardware unlock factors: FIDO2 hmac-secret and TPM 2.0 sealing."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fido2", "tpm"]
fido2 = ["dep:ctap-hid-fido2"]
# TPM support is Linux-only; the feature is a no-op elsewhere.
tpm = ["dep:tss-esapi"]

[dependencies]
ctap-hid-fido2 = { version = "=3.6.0", optional = true }
sha2 = "=0.11.1"
vault-core = { path = "../vault-core" }
zeroize = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { version = "=7.7.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
rpassword = "7"
