[package]
name = "vault-hw"
version.workspace = true
description = "Hardware unlock factors: FIDO2 hmac-secret, phone passkeys, TPM 2.0, Windows Hello and Touch ID."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fido2", "tpm"]
fido2 = ["dep:ctap-hid-fido2"]
# Phone passkeys over the hybrid transport (QR code + Bluetooth), used by the
# clients, not the daemon: libwebauthn's caBLE client on Linux (needs
# libdbus-1-dev to build), webauthn.dll on Windows.
phone = ["fido2", "dep:libwebauthn", "dep:tokio", "dep:serde_bytes", "dep:base64-url"]
# TPM 2.0: tss-esapi on Linux, the Platform Crypto Provider on Windows;
# a no-op on macOS, which has no TPM.
tpm = ["dep:tss-esapi", "dep:aes", "dep:hmac", "dep:subtle"]

[dependencies]
aes = { version = "=0.9.3", optional = true }
ctap-hid-fido2 = { version = "=3.6.0", optional = true }
hmac = { version = "=0.13.0", optional = true }
sha2 = "=0.11.1"
subtle = { version = "2.6.1", optional = true }
vault-core = { path = "../vault-core" }
zeroize = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
base64-url = { version = "3", optional = true }
libwebauthn = { version = "=0.10.0", optional = true }
serde_bytes = { version = "0.11", optional = true }
tokio = { version = "1.45", optional = true, features = ["rt-multi-thread", "macros"] }
tss-esapi = { version = "=7.7.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_Security_Cryptography", "Win32_System_TpmBaseServices", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
data-encoding = "2"
rand = "0.8.6"
rsa = "0.9.10"
sha2_010 = { package = "sha2", version = "0.10" }
rpassword = "7"
