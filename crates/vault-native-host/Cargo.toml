[package]
name = "vault-native-host"
version = "0.1.0"
description = "Browser native messaging host: relays the autofill extension to vaultd."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
vault-core = { path = "../vault-core" }
vault-ipc = { path = "../vault-ipc" }
zeroize = "1.9.1"
