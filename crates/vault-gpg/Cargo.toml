[package]
name = "vault-gpg"
version.workspace = true
description = "A gpg-compatible front end that signs and decrypts with OpenPGP keys held in vaultd."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vault-gpg"
path = "src/main.rs"

[dependencies]
pgp = { version = "0.21.0", default-features = false, features = ["pqc"] }
vault-ipc = { path = "../vault-ipc" }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3"
vault-core = { path = "../vault-core" }
vaultd = { path = "../vaultd", default-features = false }
