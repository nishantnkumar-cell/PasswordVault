[package]
name = "vault-mobile"
version.workspace = true
description = "vault-core for the iPhone/iPad and Android apps, exported over UniFFI."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: Android's libvault_mobile.so; staticlib: the iOS XCFramework;
# lib: the tests and the bindings generator.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
# Public halves of SSH and OpenPGP keys for the key screen, and new SSH keys.
# Same versions and features as vaultd.
pgp = { version = "0.21.0", default-features = false, features = ["pqc"] }
# Same release candidate as vaultd (see its Cargo.toml for why).
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["std", "ed25519", "p256", "getrandom"] }
thiserror = "2.0.21"
uniffi = "0.32.2"
vault-core = { path = "../vault-core" }
vault-import = { path = "../vault-import" }
zeroize = "1.9.1"

[dev-dependencies]
rand = "0.8.6"
