[package]
name = "vault-mobile"
version.workspace = true
description = "vault-core for the iPhone/iPad and Android apps, exported over UniFFI."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: Android's libvault_mobile.so; staticlib: the iOS XCFramework;
# lib: the tests and the bindings generator.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
thiserror = "2.0.21"
uniffi = "0.32.2"
vault-core = { path = "../vault-core" }
zeroize = "1.9.1"
