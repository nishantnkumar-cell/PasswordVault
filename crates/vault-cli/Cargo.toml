[package]
name = "vault-cli"
version.workspace = true
description = "Command-line client for vaultd."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
data-encoding = "2"
qrcode = { version = "0.14.1", default-features = false }
rpassword = "7"
vault-core = { path = "../vault-core" }
vault-hw = { path = "../vault-hw", default-features = false, features = ["phone"] }
vault-ipc = { path = "../vault-ipc" }
zeroize = "1.9.1"
