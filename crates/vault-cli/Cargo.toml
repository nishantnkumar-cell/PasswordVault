[package]
name = "vault-cli"
version = "0.1.0"
description = "Command-line client for vaultd."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
data-encoding = "2"
rpassword = "7"
vault-core = { path = "../vault-core" }
vault-ipc = { path = "../vault-ipc" }
zeroize = "1.9.1"
