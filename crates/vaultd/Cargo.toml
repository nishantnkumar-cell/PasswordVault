[package]
name = "vaultd"
version = "0.1.0"
description = "Vault daemon: holds keys, owns the vault file and hardware factors, serves clients over a Unix socket."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fido2", "tpm", "logind"]
fido2 = ["vault-hw/fido2"]
tpm = ["vault-hw/tpm"]
# Lock on suspend and screen lock (Linux, systemd-logind over D-Bus).
logind = ["dep:zbus"]

[dependencies]
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "=0.11.1"
# rand 0.8 and signature 2 are what pgp 0.21 and ssh-key 0.6 (their latest stable
# releases) build on; move them together when those crates do.
pgp = { version = "0.21.0", default-features = false, features = ["pqc"] }
rand = "0.8.6"
signature = "2.2"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "p256", "encryption", "getrandom"] }
vault-core = { path = "../vault-core" }
vault-hw = { path = "../vault-hw", default-features = false }
vault-import = { path = "../vault-import" }
vault-ipc = { path = "../vault-ipc" }
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["socket", "process", "resource", "fs", "user", "signal", "mman"] }
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# zbus 6 (2026-10-16) removed the blocking API this crate uses; stay on 5.x for now.
zbus = { version = "5.19", optional = true, default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"
pgp = { version = "0.21.0", default-features = false, features = ["pqc"] }
rand = "0.8.6"
signature = "2.2"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519"] }
