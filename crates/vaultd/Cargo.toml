[package]
name = "vaultd"
version.workspace = true
description = "Vault daemon: holds keys, owns the vault file and hardware factors, serves clients over a Unix socket."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fido2", "tpm", "logind", "secret-service"]
fido2 = ["vault-hw/fido2"]
tpm = ["vault-hw/tpm"]
# Lock on suspend and screen lock (Linux, systemd-logind over D-Bus).
logind = ["dep:zbus"]
# The freedesktop Secret Service (org.freedesktop.secrets) on the session
# bus, for apps that keep passwords through libsecret (Linux, opt-in at run
# time with --secret-service).
secret-service = ["dep:zbus", "dep:aes", "dep:cbc", "dep:hkdf", "dep:crypto-bigint", "dep:base64"]

[dependencies]
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "=0.11.1"
# rand 0.8 is what pgp 0.21 (its latest release) builds on; move it when pgp does.
pgp = { version = "0.21.0", default-features = false, features = ["pqc"] }
rand = "0.8.6"
# ssh-key is pinned to a release candidate on purpose: 0.6 (the last stable
# release) signs P-256 keys with crypto-bigint 0.5, which has timing leaks
# (RUSTSEC-2026-0387). 0.7 uses p256 0.14 on the fixed crypto-bigint 0.7.
# Move to 0.7.0 when it ships. signature 3 is the trait crate it builds on.
# The system random source for ssh-key 0.7 (rand_core 0.10).
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
signature = "3.0.0"
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["std", "ed25519", "p256", "encryption", "getrandom"] }
vault-core = { path = "../vault-core" }
vault-hw = { path = "../vault-hw", default-features = false }
vault-import = { path = "../vault-import" }
vault-ipc = { path = "../vault-ipc" }
zeroize = "1.9.1"
# Rejects weak passwords when a password-only slot is made (security review, finding 2).
zxcvbn = { version = "3.1.1", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["socket", "process", "resource", "fs", "user", "signal", "mman"] }
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# zbus 6 has only an async API; src/dbus.rs wraps it for vaultd's threads.
# tokio-multithread keeps connections running in zbus's own worker threads.
zbus = { version = "6.2.1", optional = true, default-features = false, features = ["proxy", "tokio-multithread"] }
# Secret Service sessions: dh-ietf1024-sha256-aes128-cbc-pkcs7.
aes = { version = "0.9.3", optional = true }
base64 = { version = "0.22.1", optional = true }
cbc = { version = "0.2.1", optional = true, features = ["alloc"] }
crypto-bigint = { version = "0.7.11", optional = true, default-features = false }
hkdf = { version = "0.13.0", optional = true }

[dev-dependencies]
tempfile = "3"
pgp = { version = "0.21.0", default-features = false, features = ["pqc"] }
rand = "0.8.6"
signature = "3.0.0"
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["std", "ed25519"] }
