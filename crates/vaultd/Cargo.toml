[package]
name = "vaultd"
version = "0.1.0"
description = "Vault daemon: holds keys, owns the vault file and hardware factors, serves clients over a Unix socket."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fido2", "tpm"]
fido2 = ["dep:ctap-hid-fido2"]
tpm = ["dep:tss-esapi"]

[dependencies]
ctap-hid-fido2 = { version = "=3.6.0", optional = true }
nix = { version = "0.31", features = ["socket", "process", "resource", "fs", "user", "signal"] }
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "=0.11.1"
signal-hook = "0.3"
tss-esapi = { version = "=7.7.0", optional = true }
vault-core = { path = "../vault-core" }
vault-import = { path = "../vault-import" }
vault-ipc = { path = "../vault-ipc" }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3"
