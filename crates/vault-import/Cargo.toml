[package]
name = "vault-import"
version.workspace = true
description = "Import items from other password managers' exports."
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Read an authenticator QR code from a screenshot or photo (desktop app and CLI).
qr = ["dep:image", "dep:rqrr"]

[dependencies]
csv = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png"], optional = true }
rqrr = { version = "0.11", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
vault-core = { path = "../vault-core" }
zeroize = "1.9.1"

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }
