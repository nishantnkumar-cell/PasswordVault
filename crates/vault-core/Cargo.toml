[package]
name = "vault-core"
version.workspace = true
description = "Vault file format, key hierarchy and keyslots. Pure: no I/O, no unsafe."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
data-encoding = "2"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
hmac = "=0.13.0"
kem = "=0.3.0-pre.0"
ml-dsa = { version = "=0.0.4", default-features = false }
ml-kem = { version = "=0.2.3", default-features = false, features = ["deterministic", "zeroize"] }
postcard = { version = "=1.2.0", default-features = false, features = ["alloc"] }
psl = "2"
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
sha3 = { version = "=0.10.9", default-features = false }
subtle = { version = "2.6.1", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
percent-encoding = "2.3.2"
url = "2"
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive", "serde"] }

[dev-dependencies]
proptest = "1"
sha2 = { version = "=0.11.1" }
