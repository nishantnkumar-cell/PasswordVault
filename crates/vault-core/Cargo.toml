[package]
name = "vault-core"
version = "0.1.0"
description = "Vault file format, key hierarchy and keyslots. Pure: no I/O, no unsafe."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
hmac = "=0.13.0"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "=0.11.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
sha2 = { version = "=0.11.1" }
