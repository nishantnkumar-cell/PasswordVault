<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span id="origin"></span><button id="lock" hidden>Lock</button></header>
  <div id="connect" hidden>
    <p>Connect this browser to your vault. vaultd will open a window asking you to allow it.</p>
    <button id="pair">Connect</button>
  </div>
  <form id="unlock" hidden>
    <input id="password" type="password" placeholder="Vault password" autocomplete="off" autofocus>
    <button type="submit">Unlock</button>
  </form>
  <ul id="items"></ul>
  <div id="forms"></div>
  <div id="frames" hidden></div>
  <p id="message"></p>
  <footer>
    <select id="style" aria-label="Password style">
      <option value="random">Random characters</option>
      <option value="words">Three random words</option>
      <option value="apple">Apple style (abcdef-ghijkl-mnopqr)</option>
    </select>
    <button id="generate">Generate password</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
